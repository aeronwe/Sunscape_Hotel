security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'
        App\Entity\Admin: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        admin_user_provider:
            entity:
                class: App\Entity\Admin

    role_hierarchy:
        ROLE_ADMIN: [ROLE_STAFF, ROLE_USER]
        ROLE_STAFF: [ROLE_USER]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_user_provider
            user_checker: App\Security\AdminUserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                success_handler: App\Security\AdminLoginSuccessHandler
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: account_index
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/staff, roles: ROLE_ADMIN }
        - { path: ^/admin/?$, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_STAFF }
        - { path: ^/account, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
