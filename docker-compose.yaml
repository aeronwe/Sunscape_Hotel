services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sunscape_symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - sunscape_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "8082:80"

volumes:
  sunscape_mysql_data:
